name: Validate & Publish
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  validate:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Verify package_version.cs
        run: dotnet build ./.github/workflows/package_version.cs

      - name: Test
        run: dotnet test -c Release --no-build -m:1 --logger trx --results-directory "TestResults-${{ matrix.os }}"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults-${{ matrix.os }}
        if: ${{ always() }}

  validate-big-endian:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: s390x

      - name: Build & Test
        run: |
          docker run --rm --platform linux/s390x --user 0 \
            -e DNSCORE_TEST_PYTHON_HOME=/opt/dnscore-python \
            -v "${{ github.workspace }}:/src" -w /src \
            registry.access.redhat.com/dotnet/sdk:10.0 /bin/bash -lc '
            set -eu
            test "$(uname -m)" = "s390x"
            microdnf install -y python3.12 python3.12-devel python3.12-pip bind-utils
            python=/usr/bin/python3.12
            stdlib=$("$python" -I -c "import sysconfig; print(sysconfig.get_path('\''stdlib'\''))")
            libdir=$("$python" -I -c "import sysconfig; print(sysconfig.get_config_var('\''LIBDIR'\''))")
            ldlibrary=$("$python" -I -c "import sysconfig; print(sysconfig.get_config_var('\''LDLIBRARY'\''))")
            test -x "$python"
            test -r "$libdir/$ldlibrary"
            test -r "$stdlib/os.py"
            test -d "$stdlib/lib-dynload"
            install -d /opt/dnscore-python/bin /opt/dnscore-python/lib
            ln -s "$python" /opt/dnscore-python/bin/python3
            ln -s "$libdir/$ldlibrary" /opt/dnscore-python/lib/libpython3.12.so
            ln -s "$stdlib" /opt/dnscore-python/lib/python3.12
            /opt/dnscore-python/bin/python3 -c "import sys; assert sys.byteorder == '\''big'\''; print(sys.version)"
            dotnet build DnsCore.Tests/DnsCore.Tests.csproj -c Release -f net10.0
            dotnet test DnsCore.Tests/DnsCore.Tests.csproj -c Release -f net10.0 --no-build -m:1 --logger trx --results-directory /src/TestResults-s390x -- RunConfiguration.TreatNoTestsAsError=true
          '

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-s390x
          path: TestResults-s390x
        if: ${{ always() }}

  publish:
    if: ${{ success() && (vars.PUBLISH == 'true' || vars.PUBLISH == 'auto' && github.ref_name == 'master') }}
    needs:
      - validate
      - validate-big-endian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Package Version
        id: package_version
        run: |
          version=$(dotnet ./.github/workflows/package_version.cs)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build -c Release

      - name: Pack
        run: dotnet pack ./DnsCore/DnsCore.csproj -c Release --no-build -p:Version=${{ steps.package_version.outputs.version }}

      - name: Push
        run: dotnet nuget push **/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate